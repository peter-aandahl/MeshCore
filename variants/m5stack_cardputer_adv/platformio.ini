[M5Stack_Cardputer_Adv]
extends = esp32_base
board = m5stack-stamps3
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/m5stack_cardputer_adv
  -D M5STACK_CARDPUTER_ADV
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D PIN_USER_BTN=0
  -D PIN_VBAT_READ=10
  -D PIN_SDCARD_CS=12
  -D PIN_BOARD_SDA=8
  -D PIN_BOARD_SCL=9
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8f
  -D P_LORA_SCLK=40
  -D P_LORA_MISO=39
  -D P_LORA_MOSI=14
  -D P_LORA_NSS=5
  -D P_LORA_RESET=3
  -D P_LORA_DIO_1=4
  -D P_LORA_BUSY=6
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D DISPLAY_WIDTH=135
  -D DISPLAY_HEIGHT=240
  -D DISPLAY_ROTATION=3
  -D DISPLAY_SCALE_X=1.875f
  -D DISPLAY_SCALE_Y=2.109375f
  -D PIN_TFT_SCL=36
  -D PIN_TFT_SDA=35
  -D PIN_TFT_CS=37
  -D PIN_TFT_DC=34
  -D PIN_TFT_RST=33
  -D PIN_TFT_LEDA_CTL=38
  -D PIN_TFT_VDD_CTL=-1
  -D ENV_INCLUDE_GPS=1
  -D PIN_GPS_RX=15
  -D PIN_GPS_TX=13
  -D GPS_BAUD_RATE=115200
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/m5stack_cardputer_adv>
  +<helpers/sensors/*.cpp>
  +<helpers/ui/ST7789LCDDisplay.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0

[env:M5Stack_Cardputer_Adv_repeater]
extends = M5Stack_Cardputer_Adv
build_flags =
  ${M5Stack_Cardputer_Adv.build_flags}
  -D ADVERT_NAME='"Cardputer Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${M5Stack_Cardputer_Adv.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${M5Stack_Cardputer_Adv.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:M5Stack_Cardputer_Adv_room_server]
extends = M5Stack_Cardputer_Adv
build_flags =
  ${M5Stack_Cardputer_Adv.build_flags}
  -D ADVERT_NAME='"Cardputer Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${M5Stack_Cardputer_Adv.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${M5Stack_Cardputer_Adv.lib_deps}
  ${esp32_ota.lib_deps}

[env:M5Stack_Cardputer_Adv_companion_radio_ble]
extends = M5Stack_Cardputer_Adv
build_flags =
  ${M5Stack_Cardputer_Adv.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_WIFI_INTERFACE
build_src_filter = ${M5Stack_Cardputer_Adv.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/wifi/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${M5Stack_Cardputer_Adv.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:M5Stack_Cardputer_Adv_companion_radio_usb]
extends = M5Stack_Cardputer_Adv
build_flags =
  ${M5Stack_Cardputer_Adv.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
build_src_filter = ${M5Stack_Cardputer_Adv.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${M5Stack_Cardputer_Adv.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:M5Stack_Cardputer_Adv_companion_radio_wifi]
extends = M5Stack_Cardputer_Adv
build_flags =
  ${M5Stack_Cardputer_Adv.build_flags}
  -I examples/companion_radio/ui-new
  -D ENABLE_WIFI_INTERFACE
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
build_src_filter = ${M5Stack_Cardputer_Adv.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/wifi/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${M5Stack_Cardputer_Adv.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:M5Stack_Cardputer_Adv_kiss_modem]
extends = M5Stack_Cardputer_Adv
build_src_filter = ${M5Stack_Cardputer_Adv.build_src_filter}
  +<../examples/kiss_modem/>
